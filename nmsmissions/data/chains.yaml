# Quest-line order for the read-only mission viewer.
# Add a chain, or insert a step, without changing code.
# `requires` names other chain ids that should be finished first.
# `optional: true` shows a step but does not count it as "the next thing to do".
# A completion value of -1 (see the mission tables) is treated the same way:
# the finished game leaves that branch at -1, so it must not block the chain.
#
# Unlock order, from the NMS wiki as written in the mission spec:
#   Artemis Path (through The Purge) -> They Who Returned
#   They Who Returned + Atlas Path -> In Stellar Multitudes
# They Who Returned also needs a Harmonic Camp seal (Aeron Turbojet). That
# is not a mission id, so it is only a note on that chain.
# Atlas Path is a prerequisite of In Stellar Multitudes, not of They Who Returned.
# Edit `requires` if you want a different graph.
#
# wiki is a No Man's Sky Wiki page. wiki_confirmed is false when the page
# name is only the chain title with spaces turned into underscores.
# A step may set its own wiki. Without one, the tool searches for the title.

chains:
  - id: artemis
    title: Artemis Path
    wiki: https://nomanssky.fandom.com/wiki/Artemis_Path
    wiki_confirmed: true
    group: story
    requires: []
    note: "Main story through The Purge. A finished log shows New Beginnings."
    steps:
      - "^ACT1_STEP1"
      - "^ACT1_STEP2"
      - "^ACT1_STEP3"
      - "^ACT1_STEP4"
      - "^ACT1_STEP5"
      - "^ACT1_STEP6"
      - "^ACT1_STEP7"
      - "^ACT1_STEP8"
      - "^ACT1_STEP9"
      - "^ACT1_STEP10"
      - "^ACT1_STEP11"
      - "^ACT1_STEP12"
      - "^ACT1_STEP13"
      - "^ACT2_STEP1"
      - "^ACT2_STEP2"
      - "^ACT2_STEP3"
      - "^ACT2_STEP4"
      - "^ACT2_STEP5"
      - "^ACT2_STEP6"
      - "^ACT2_STEP7"
      - "^ACT2_STEP8"
      - "^ACT2_STEP9"
      - "^ACT2_STEP10"
      - "^ACT2_STEP11"
      - "^ACT2_STEP12"
      - "^ACT2_STEP13"
      - "^ACT3_STEP1"
      - "^ACT3_STEP2"
      - "^ACT3_STEP3"
      - "^ACT3_STEP4"
  - id: atlas
    title: Atlas Path
    wiki: https://nomanssky.fandom.com/wiki/The_Atlas_Path
    wiki_confirmed: true
    group: story
    requires: []
    note: "Finishes at Atlas Eternal. Required, with They Who Returned, before In Stellar Multitudes. POI_ATLAS_COMMS and SENTMISS_ATLAS are optional and listed here, not in They Who Returned: a 7.05 save had both already done while that quest was still on its first step."
    steps:
      - "^ATLAS1"
      - "^ATLAS2"
      - "^ATLAS3"
      - "^ATLAS4"
      - "^ATLAS5"
      - "^ATLAS6"
      - "^ATLAS7"
      - "^ATLAS8"
      - "^ATLAS9"
      - "^ATLAS10"
      - "^ATLAS11"
      - id: "^ATLAS_LORE"
        optional: true
      - "^ATLAS_LOOP_STAR"
      - "^AP11_STAR"
      - "^REMEMBRANCE"
      - "^HAS_STARSEED"
      - id: "^ATLAS_LOOP_DENY"
        optional: true
      - id: "^POI_ATLAS_COMMS"
        optional: true
      - id: "^SENTMISS_ATLAS"
        optional: true
  - id: twr
    title: They Who Returned
    wiki: https://nomanssky.fandom.com/wiki/They_Who_Returned
    wiki_confirmed: true
    group: story
    requires: [artemis]
    note: "Also needs a Harmonic Camp seal (Aeron Turbojet customization). That is not a mission id. Step order inside this chain is best-effort."
    steps:
      - "^ROBOT_INTRO"
      - "^ROBOMISS_0"
      - "^ROBOMISS_1"
      - "^ROBOMISS_1A"
      - "^ROBOMISS_2"
      - "^ROBOMISS_3_BUI"
      - "^ROBOMISS_3_NADA"
      - "^ROBOMISS_4"
      - "^ROBOMISS_BOAT"
      - "^POI_MEMORYBOAT"
      - id: "^SENT_MISS_LORE"
        optional: true
      - id: "^ROBOMISS_LORE_"
        optional: true
      - "^ROBOM_ATLAS3"
      - "^ROBOM_ATLAS3_H"
      - "^ROBOM_HOPE"
      - "^ROBOM_NADAR2"
      - "^ROBOM_STAFF_A"
